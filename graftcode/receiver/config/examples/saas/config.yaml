# Example: the same pipeline retargeted from travel to a SaaS company blog.
# Try it (demo mode, no API keys):
#   PIPELINE_CONFIG=receiver/config/examples/saas/config.yaml \
#   WAYZYY_WRITER_DIR=/nonexistent WAYZYY_SCANNER_DIR=/nonexistent bash scripts/start.sh

brand:
  name: Acme Analytics
  description: Product analytics for B2B SaaS teams
  topic_keyword: analytics
  fallback_research_prompt: "Topic: {topic}. Write a practical, example-led article for {brand} readers."

categories:
  default: Article
  rules:
    - name: Tutorials
      keywords: [how to, tutorial, guide, setup]
    - name: Product
      keywords: [dashboard, feature, release, integration]
    - name: Pricing & Plans
      keywords: [pricing, plan, cost]

suggestion:
  tiers:
    - [pricing, alternative, vs, comparison, switch from]
    - [how to, tutorial, setup, integration]
    - [trends, benchmark, report, best practices]

style:
  banned_words: [synergy, game-changer, cutting-edge, revolutionary, leverage, seamlessly, robust]
  banned_openers: [in today's fast-paced world, in the ever-evolving]
  attribution_keyword: ""
  publish_threshold: 90

editorial:
  minimum_words: 900
  maximum_primary_keyword_uses: 8
  required_sections: [FAQ, examples]
  require_sources: true
  require_image_attribution: false
  require_human_review: true

editorial_rules:
  tone: "Clear, evidence-led, practical, and written for working SaaS teams."
  required_elements: [concrete examples, source links, implementation trade-offs]
  banned_phrases: ["in today's fast-paced world", "unlock the power of"]

data_dir: data
